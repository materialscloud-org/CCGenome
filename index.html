<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C-C Cross-Coupling Genome</title>
    <meta
      name="description"
      content="Interactive map of about 25,000 Pd, Pt, Cu, Ni, Au and Ag cross-coupling catalyst complexes, with the 3D structure and properties of each complex."
    />

    <!-- Plausible analytics -->
    <script type="text/javascript">
      var header = document.getElementsByTagName("head")[0];
      var plausible = document.createElement("script");
      var domain_name = window.location.hostname;
      var rollup_name = "plausible-rollup.materialscloud.org";

      plausible.async = "";
      plausible.defer = "";
      plausible.dataset["domain"] = domain_name + "," + rollup_name;
      plausible.src = "https://plausible.io/js/plausible.js";
      header.appendChild(plausible);
    </script>
    <!-- end Plausible analytics -->
  </head>
  <body>
    <noscript>
      The C-C Cross-Coupling Genome is an interactive map of cross-coupling
      catalyst complexes. It needs JavaScript to run.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
